name: Publish core package

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write
    packages: write

concurrency:
    group: publish-core
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'todoist/ui-extensions' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  registry-url: https://registry.npmjs.org/
                  scope: '@todoist'
            - run: npm install --global npm@11.19.0
            - run: npm ci --ignore-scripts
            - run: npm run integrity-check --workspace=packages/ui-extensions-core
            - name: Pack once
              run: |
                  mkdir -p "$RUNNER_TEMP/core-release"
                  npm pack --workspace=packages/ui-extensions-core --ignore-scripts --pack-destination="$RUNNER_TEMP/core-release"
            - uses: actions/upload-artifact@v4
              with:
                  name: core-package
                  path: ${{ runner.temp }}/core-release/*.tgz
                  if-no-files-found: error
            - name: Publish to npm
              run: npm publish "$RUNNER_TEMP/core-release/"*.tgz --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org/
            - uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  registry-url: https://npm.pkg.github.com/
                  scope: '@todoist'
            - name: Publish to GitHub Packages
              run: npm publish "$RUNNER_TEMP/core-release/"*.tgz --ignore-scripts --access public --registry=https://npm.pkg.github.com/
              env:
                  NODE_AUTH_TOKEN: ${{ github.token }}
